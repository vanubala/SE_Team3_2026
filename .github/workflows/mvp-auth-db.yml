name: MVP database and authentication tests
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/mvp-auth-db.yml'
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/mvp-auth-db.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: locker_ci
          POSTGRES_USER: locker_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U locker_ci -d locker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://locker_ci:ci-only-password@127.0.0.1:5432/locker_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head --sql
      - run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing
